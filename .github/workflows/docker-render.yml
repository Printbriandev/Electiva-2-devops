name: CI/CD - Build, Push a Docker Hub y Deploy a Render

on:
  push:
    branches:
      - main
      - Electiva-integracion-continua
  workflow_dispatch:

env:
  IMAGEN: printbagm/hola-mundo-devops
  CONTEXTO: ./Practica Entrega Continua

jobs:
  build-and-push:
    name: Construir y subir imagen a Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXTO }}
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}

  deploy:
    name: Desplegar a produccion en Render
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Disparar despliegue en Render
        run: |
          RESPUESTA=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          CODIGO=$(echo "$RESPUESTA" | tail -n 1)
          CUERPO=$(echo "$RESPUESTA" | sed '$d')

          echo "Codigo HTTP: $CODIGO"
          echo "Respuesta: $CUERPO"

          if [ "$CODIGO" -ne 201 ] && [ "$CODIGO" -ne 200 ]; then
            echo "Error: Render rechazo el despliegue"
            exit 1
          fi

          echo "Despliegue iniciado correctamente en Render"
